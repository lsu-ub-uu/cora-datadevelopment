[project]
name = "cora-datadevelopment"
version = "1.0.0"
dependencies = [
    "requests",
    "requests-toolbelt",
    "requests-mock",
    "tqdm",
    "pytest",
    "pytest-cov",
    "pytest-watcher",
    "fabric",
    "psycopg2-binary"
]
license = "GPL-3.0"

[project.scripts]
publishers-export = "scripts.publishers_export:main"
publishers-import = "scripts.publishers_import:main"
funders-export = "scripts.funders_export:main"
funders-import = "scripts.funders_import:main"
journals-export = "scripts.journals_export:main"
journals-import = "scripts.journals_import:main"
series-export = "scripts.series_export:main"
series-import = "scripts.series_import:main"
subjects-export = "scripts.subjects_export:main"
subjects-import = "scripts.subjects_import:main"
outputs-import = "scripts.outputs_import:main"
outputs-export = "scripts.outputs_export:main"
outputs-testdata-create = "scripts.outputs_testdata_create:main"
organisations-migrate = "scripts.organisations_migrate:main"
diva-migrate = "scripts.diva_migrate:main"
create-validation-types = "scripts.create_new_validation_types:main"
delete-validation-types = "scripts.delete_validation_types:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test"]